name: Secrets Lesson

on: workflow_dispatch

env:
  APP_NAME: "my-demo-app"

jobs:
  show-config:
    runs-on: ubuntu-latest
    env:
      LABEL: "practice"
    steps:
      - name: Plain environment variables
        env:
          GREETING: "Hello from step level"
        run: |
          echo "App: $APP_NAME"
          echo "Label: $LABEL"
          echo "$GREETING"

      - name: Context information
        run: |
          echo "Triggered by: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Runs on: ${{ runner.os }}"

      - name: Repository variable
        run: echo "Message is ${{ vars.WELCOME_MESSAGE }}"

      - name: Use the secret
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          echo "The key has ${#API_KEY} characters"
          echo "Trying to print it: $API_KEY"
